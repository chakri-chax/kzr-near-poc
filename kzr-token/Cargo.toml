[package]
name = "kzr-token"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Kruzer Coin (KZR) — NEP-141 fungible token. Native-NEAR port of Kruzer.sol."
repository = "https://github.com/kruzer/near-poc"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"
near-contract-standards = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }
