[package]
name = "game-assets"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Kruzer game assets — NEP-245 multi-token with ed25519 voucher minting. Native-NEAR port of KruzerAssets1155.sol."
repository = "https://github.com/kruzer/near-poc"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `legacy` provides near_sdk::collections (LookupMap etc.).
near-sdk = { version = "5.29", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing", "legacy"] }
# Used only in tests to produce ed25519-signed vouchers (the on-chain side
# verifies via env::ed25519_verify). The production signer is backend/sign_voucher.mjs.
ed25519-dalek = "2"
